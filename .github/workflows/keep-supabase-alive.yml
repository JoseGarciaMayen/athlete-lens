name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Insert and delete keepalive row
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "insert into _keepalive (pinged_at) values (now());"
          psql "$DATABASE_URL" -c "delete from _keepalive where pinged_at < now() - interval '1 day';"
